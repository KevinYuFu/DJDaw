appId: com.kevinyufu.djdaw
productName: DJDaw
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig.json,tsconfig.*.json}'
  - '!docs/*'
asarUnpack:
  - resources/**
extraResources:
  # The stem model, fetched by scripts/fetch-model.mjs rather than committed.
  - from: resources/htdemucs_embedded.onnx
    to: htdemucs_embedded.onnx
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
  darkModeSupport: true
  extendInfo:
    NSMicrophoneUsageDescription: DJDaw does not record audio.
    NSDocumentsFolderUsageDescription: DJDaw reads the audio files you import.
    NSDownloadsFolderUsageDescription: DJDaw reads the audio files you import.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
